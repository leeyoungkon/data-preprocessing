<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemma + LightRAG 실습</title>
<style>body{font:16px system-ui,sans-serif;max-width:1000px;margin:40px auto;padding:0 20px;background:#f5f7fa;color:#162137}h1{font-size:28px}textarea{width:100%;box-sizing:border-box;padding:14px;font:inherit;border:1px solid #bac4d2;border-radius:10px}button,select{font:inherit;padding:10px;margin:8px 8px 8px 0}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;border:1px solid #d7dce5;padding:18px;border-radius:10px}summary{cursor:pointer}#samples button{display:block;text-align:left;font-size:14px}label{white-space:nowrap}</style>
<h1>Gemma 3 12B + LightRAG</h1><p>같은 질문을 벡터 검색과 그래프 검색으로 비교합니다. 먼저 터미널에서 <code>python app.py ingest</code>를 실행하세요.</p>
<details><summary>테스트 질문 5개</summary><div id="samples"></div></details>
<textarea id="q" rows="3">김민수가 책임자인 프로젝트에서 사용하는 시스템의 공급사와 그 공급사의 기술지원 담당자는 누구인가?</textarea>
<select id="mode"><option value="mix">mix: 그래프 + 문서 벡터</option><option value="naive">naive: 문서 벡터</option><option value="hybrid">hybrid: 개체 + 관계</option><option value="local">local: 개체 중심</option><option value="global">global: 관계 중심</option></select>
<label><input id="context" type="checkbox">검색 근거만 보기</label><br>
<button id="run">질문 실행</button><button id="compare">naive / hybrid / mix 비교</button>
<p id="status" role="status"></p><div id="answers"></div>
<details><summary>추출된 지식 그래프의 개체·관계 확인</summary><button id="graph">관계 목록 불러오기</button><pre id="graphout">색인 후 확인할 수 있습니다.</pre></details>
<script>
const $=id=>document.getElementById(id);
async function request(url,options){const r=await fetch(url,options);const j=await r.json();if(!r.ok)throw Error(j.detail||r.statusText);return j}
async function run(modes){$('answers').replaceChildren();$('run').disabled=$('compare').disabled=true;$('status').textContent='검색·답변 생성 중입니다. 최초 실행은 모델 로딩으로 오래 걸릴 수 있습니다.';try{for(const mode of modes){const data=await request('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:$('q').value,mode,context_only:$('context').checked})});const title=document.createElement('h3');title.textContent=`${mode} · ${data.seconds}초`;const pre=document.createElement('pre');pre.textContent=typeof data.result==='string'?data.result:JSON.stringify(data.result,null,2);$('answers').append(title,pre)}$('status').textContent='완료'}catch(e){$('status').textContent='오류: '+e.message}finally{$('run').disabled=$('compare').disabled=false}}
$('run').onclick=()=>run([$('mode').value]);$('compare').onclick=()=>run(['naive','hybrid','mix']);
$('graph').onclick=async()=>{try{const g=await request('/api/graph');$('graphout').textContent=`개체 ${g.nodes.length}개 / 관계 ${g.edges.length}개\n\n`+g.nodes.map(n=>`${n.id}: ${n.description||''}`).join('\n')+'\n\n'+g.edges.map(e=>`${e.source} → ${e.target}\n  ${e.description||''}`).join('\n')}catch(e){$('graphout').textContent=e.message}};
request('/api/questions').then(qs=>qs.forEach(q=>{const b=document.createElement('button');b.textContent=q.question;b.onclick=()=>{$('q').value=q.question};$('samples').append(b)})).catch(e=>{$('status').textContent=e.message});
</script></html>
